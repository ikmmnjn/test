<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사후 심리검사 · 만족도 조사 안내</title>
  <style>
    :root {
      --brand: #5B3DF6;
      --brand-dark: #4526D9;
      --brand-soft: #EFEBFF;
      --brand-line: #D9D0FF;
      --ink: #1B1B2F;
      --ink-2: #4A4A63;
      --muted: #8A8AA3;
      --line: #EAEAF2;
      --bg: #F2F2F6;
      --card: #FFFFFF;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: clamp(0px, 3vw, 40px);
    }

    img {
      max-width: 100%;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .shell {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      background: var(--card);
      border-radius: clamp(0px, 3vw, 24px);
      box-shadow: 0 18px 50px rgba(27, 27, 47, 0.08);
      overflow: hidden;
    }

    /* ── 상단 바 ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: clamp(14px, 3vw, 20px) clamp(16px, 4vw, 32px);
      border-bottom: 1px solid var(--line);
    }

    .topbar .logo {
      height: clamp(28px, 6vw, 34px);
      width: auto;
      display: block;
    }

    .trust {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .trust svg {
      flex: none;
    }

    @media (max-width: 720px) {
      .trust span {
        display: none;
      }
    }

    /* ── 히어로 ── */
    .hero {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(16px, 2.6vw, 30px);
      padding: clamp(18px, 2.8vw, 28px) clamp(16px, 4vw, 32px);
      background: linear-gradient(120deg, #FFF7F0 0%, #FFFFFF 45%, #F6F3FF 100%);
      border-bottom: 1px solid var(--line);
    }

    .hero-art {
      width: clamp(112px, 13vw, 154px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, #FFF6EC 0%, #FFEBD8 62%, #FBE0C8 100%);
      display: grid;
      place-items: center;
      flex: none;
    }

    .hero-icon {
      width: 68%;
      height: auto;
      display: block;
    }

    .hero h1 {
      margin: 0 0 4px;
      font-size: clamp(22px, 3.6vw, 33px);
      font-weight: 800;
      letter-spacing: -1px;
      word-break: keep-all;
    }

    .hero .lead {
      margin: 0 0 7px;
      font-size: clamp(15px, 2.1vw, 19px);
      font-weight: 700;
      color: var(--brand);
      letter-spacing: -0.5px;
      word-break: keep-all;
    }

    .hero .sub {
      margin: 0;
      font-size: clamp(13px, 2vw, 15px);
      color: var(--ink-2);
      word-break: keep-all;
    }

    .hero-note {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 250px;
      padding: 13px 15px;
      border: 1px solid #F3E2CE;
      border-radius: var(--radius);
      background: #FFF8EF;
      font-size: 13.5px;
      color: #6B5A45;
      word-break: keep-all;
    }

    .hero-note svg {
      flex: none;
    }

    .hero-note p {
      margin: 0;
    }

    @media (max-width: 980px) {
      .hero {
        grid-template-columns: 1fr auto;
      }

      .hero-art {
        order: 2;
        width: clamp(92px, 21vw, 126px);
      }

      .hero-copy {
        order: 1;
      }

      .hero-note {
        order: 3;
        grid-column: 1 / -1;
        max-width: none;
      }
    }

    @media (max-width: 560px) {
      .hero-note {
        display: none;
      }
    }

    /* ── 검색 / 정렬 ── */
    .picker {
      padding: clamp(16px, 3vw, 26px) clamp(16px, 4vw, 32px) clamp(20px, 4vw, 30px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: clamp(14px, 2.5vw, 20px);
    }

    .search {
      position: relative;
      flex: 0 1 300px;
    }

    @media (max-width: 560px) {
      .search {
        flex: 1 1 100%;
      }
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: #FAFAFD;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }

    .search input::placeholder {
      color: var(--muted);
    }

    .search input:focus {
      background: #fff;
      border-color: var(--brand-line);
      box-shadow: 0 0 0 3px rgba(91, 61, 246, 0.12);
    }

    /* ── 기관 그리드 ── */
    .org-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(10px, 1.4vw, 16px);
    }

    @media (max-width: 1080px) {
      .org-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .org-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .org-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .org {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: clamp(112px, 13vw, 132px);
      padding: 18px 12px 14px;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      text-align: center;
      text-decoration: none;
      color: var(--ink-2);
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }

    .org:hover {
      border-color: var(--brand-line);
      box-shadow: 0 6px 18px rgba(91, 61, 246, 0.10);
      transform: translateY(-2px);
    }

    .org:focus-visible {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(91, 61, 246, 0.18);
    }

    .org-logo {
      width: 100%;
      height: clamp(52px, 6.4vw, 68px);
    }

    .org-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    @media (max-width: 560px) {    }

    .empty {
      margin: 28px 0 8px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    /* ── 하단 액션 바 ── */
    .actionbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vw, 44px);
      flex-wrap: wrap;
      margin: 0 clamp(16px, 4vw, 32px) clamp(20px, 4vw, 32px);
      padding: clamp(16px, 2.5vw, 22px) clamp(16px, 2.5vw, 24px);
      background: #FAFAFD;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .help {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 1 auto;
    }

    .round-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: none;
      border-radius: 50%;
      background: var(--brand-soft);
      color: var(--brand);
    }

    .help b {
      display: block;
      font-size: 14px;
      color: var(--ink);
    }

    .help span {
      font-size: 12.5px;
      color: var(--muted);
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: clamp(18px, 4vw, 44px);
      border-left: 1px solid var(--line);
    }

    .contact-icon {
      display: grid;
      place-items: center;
      flex: none;
    }

    .contact .tel {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .contact .tel a {
      color: var(--brand);
      text-decoration: none;
      font-size: 16px;
      letter-spacing: -0.2px;
    }

    .contact .hours {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    @media (max-width: 860px) {
      .actionbar {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 14px;
      }

      /* 세로 배치에서는 flex-basis가 높이로 해석되므로 해제 */
      .help {
        flex: 0 0 auto;
        align-items: flex-start;
      }

      .contact {
        align-items: flex-start;
        padding-left: 0;
        gap: 12px;
        border-left: none;
      }

      /* 아이콘 폭을 위 블록(.round-icon)과 맞춰 좌측 레일 정렬 */
      .contact-icon {
        width: 40px;
      }
    }

    .foot {
      margin: 0;
      padding: 0 clamp(16px, 4vw, 32px) clamp(18px, 3vw, 26px);
      text-align: center;
      font-size: 12px;
      color: #B4B4C6;
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <img class="logo" src="assets/logos/mycoun.png" alt="마이카운슬러">
      <p class="trust">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">

          <path d="M9 12l2 2 4-4" />

        <span>안전하고 신뢰할 수 있는 심리검사 서비스</span>

    <section class="hero">
      <div class="hero-art" aria-hidden="true">
        <!-- 사후 검사: 검사 완료 + 만족도 평가 -->
        <svg class="hero-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="22" y="16" width="60" height="82" rx="10" fill="#fff" stroke="#5B3DF6" stroke-width="3.5" />
          <rect x="41" y="8" width="22" height="15" rx="6" fill="#5B3DF6" />
          <rect x="33" y="38" width="38" height="5" rx="2.5" fill="#D9D0FF" />

          <g fill="#F5B942">

      </div>
      <div class="hero-copy">
        <h1>사후 심리검사 · 만족도 조사 안내</h1>
        <p class="lead">소속 기관을 선택해 주세요</p>
        <p class="sub">선택하신 기관의 사후 심리검사 · 만족도 조사 전용 페이지로 이동합니다.</p>
      </div>
      <aside class="hero-note">
        <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#E08A3C" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <path d="M14 2v6h6" />
          <path d="M9 13l2 2 4-4" />
        </svg>
        <p>정확한 효과성 분석을 위해<br>소속 기관을 올바르게 선택해 주세요.</p>
      </aside>
    </section>

    <section class="picker">
      <div class="toolbar">
        <div class="search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A8AA3" stroke-width="2"
            stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input id="q" type="search" placeholder="기관명 검색" autocomplete="off" aria-label="기관명 검색">
        </div>
      </div>

      <div class="org-grid" id="grid"></div>
      <p class="empty" id="empty" hidden>검색 결과가 없습니다. 다른 기관명으로 검색해 주세요.</p>

      <noscript>
        <div class="org-grid">
          <a class="org" href="../sites/kyobo/post/index.html"><span class="org-logo"><img src="assets/logos/kyobo.svg"
                alt="교보문고"></span></a>
          <a class="org" href="../sites/daejoo/post/index.html"><span class="org-logo"><img
                src="assets/logos/daejoo.png" alt="대주산업"></span></a>
          <a class="org" href="../sites/sen/post/index.html"><span class="org-logo"><img src="assets/logos/seoul.png"
                alt="서울특별시교육청"></span></a>
          <a class="org" href="../sites/fpnco/post/index.html"><span class="org-logo"><img src="assets/logos/fpnco.svg"
                alt="에프피앤코"></span></a>
          <a class="org" href="../sites/jdc/post/index.html"><span class="org-logo"><img src="assets/logos/jdc.png"
                alt="제주국제자유도시개발센터"></span></a>
          <a class="org" href="../sites/zrzg/post/index.html"><span class="org-logo"><img src="assets/logos/jiran.png"
                alt="지란지교소프트"></span></a>
          <a class="org" href="../sites/kintex/post/index.html"><span class="org-logo"><img src="assets/logos/kintex.png"
                alt="킨텍스"></span></a>
          <a class="org" href="../sites/ssis/post/index.html"><span class="org-logo"><img src="assets/logos/ssis%20v.png"
                alt="한국사회보장정보원"></span></a>
          <a class="org" href="../sites/kspo/post/index.html"><span class="org-logo"><img src="assets/logos/kspo.svg"
                alt="한국스포츠레저"></span></a>
          <a class="org" href="../sites/stop/post/index.html"><span class="org-logo"><img src="assets/logos/kwhri.png"
                alt="한국여성인권진흥원"></span></a>
          <a class="org" href="../sites/kawf/post/index.html"><span class="org-logo"><img src="assets/logos/kawf.png"
                alt="한국예술인복지재단"></span></a>
          <a class="org" href="../sites/kcc/post/index.html"><span class="org-logo"><img src="assets/logos/kcc%20v.png"
                alt="한국저작권위원회"></span></a>
        </div>
      </noscript>
    </section>

    <footer class="actionbar">
      <div class="help">
        <span class="round-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14v-2a8 8 0 0 1 16 0v2" />
            <path
              d="M18 19a2 2 0 0 0 2-2v-3h-2a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2zM6 19a2 2 0 0 1-2-2v-3h2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2z" />
          </svg>
        </span>
        <p style="margin:0">
          <b>기관이 보이지 않나요?</b>
          <span>소속 기관 검색이 어렵다면 고객센터로 문의해 주세요.</span>
        </p>
      </div>
      <div class="contact">
        <span class="contact-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5B3DF6" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z" />
          </svg>
        </span>
        <p class="tel" style="margin:0">고객센터 <a href="tel:18770410">1877-0410</a>
          <span class="hours">운영시간: 평일 09:00 - 18:00 (주말/공휴일 휴무)</span>
        </p>
      </div>
    </footer>

    <p class="foot">문의: 마이카운슬러 EAP</p>
  </div>

  <script>
    (function () {
      var PHASE = 'post';

      var ORGS = [
        { slug: 'kyobo', name: '교보문고', logo: 'kyobo.svg', kw: 'kyobo 교보' },
        { slug: 'daejoo', name: '대주산업', logo: 'daejoo.png', kw: 'daejoo 대주' },
        { slug: 'sen', name: '서울특별시교육청', logo: 'seoul.png', kw: 'sen seoul 서울 교육청' },
        { slug: 'fpnco', name: '에프피앤코', logo: 'fpnco.svg', kw: 'fpnco flatpoint 플랫포인트' },
        { slug: 'jdc', name: '제주국제자유도시개발센터', logo: 'jdc.png', kw: 'jdc 제주' },
        { slug: 'zrzg', name: '지란지교소프트', logo: 'jiran.png', kw: 'zrzg jiran 지란' },
        { slug: 'kintex', name: '킨텍스', logo: 'kintex.png', kw: 'kintex 킨텍스' },
        { slug: 'ssis', name: '한국사회보장정보원', logo: 'ssis v.png', kw: 'ssis 사회보장' },
        { slug: 'kspo', name: '한국스포츠레저', logo: 'kspo.svg', kw: 'kspo 스포츠' },
        { slug: 'stop', name: '한국여성인권진흥원', logo: 'kwhri.png', kw: 'stop kwhri 여성인권' },
        { slug: 'kawf', name: '한국예술인복지재단', logo: 'kawf.png', kw: 'kawf 예술인' },
        { slug: 'kcc', name: '한국저작권위원회', logo: 'kcc v.png', kw: 'kcc 저작권' }
      ];

      var grid = document.getElementById('grid');
      var empty = document.getElementById('empty');
      var q = document.getElementById('q');

      function hrefOf(org) {
        return '../sites/' + org.slug + '/' + PHASE + '/index.html';
      }

      function visibleList() {
        var term = q.value.trim().toLowerCase();
        if (!term) return ORGS;
        return ORGS.filter(function (o) {
          return (o.name + ' ' + o.kw).toLowerCase().indexOf(term) > -1;
        });
      }

      function render() {
        var list = visibleList();

        grid.innerHTML = '';
        list.forEach(function (o) {
          var a = document.createElement('a');
          a.className = 'org';
          a.href = hrefOf(o);
          a.target = '_blank';
          a.rel = 'noopener';
          a.title = o.name;
          a.setAttribute('aria-label', o.name);
          a.innerHTML =
            '<span class="org-logo"><img src="assets/logos/' + encodeURI(o.logo) + '" alt=""></span>';
          grid.appendChild(a);
        });

        empty.hidden = list.length !== 0;
      }

      q.addEventListener('input', render);

      render();
    })();
  </script>
</body>

</html>
